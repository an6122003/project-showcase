# Deploy to GitHub Pages using GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout proposal
        uses: actions/checkout@v4
        with:
          repository: an6122003/kol-proposal
          path: _proposal-source

      - name: Install proposal dependencies
        working-directory: _proposal-source
        run: npm ci

      - name: Build proposal at /proposal
        working-directory: _proposal-source
        run: npm run export:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /proposal

      - name: Add proposal to the custom-domain site
        run: |
          mkdir -p dist/proposal
          cp -R _proposal-source/out/. dist/proposal/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
